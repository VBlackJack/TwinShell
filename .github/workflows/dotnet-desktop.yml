name: .NET Desktop CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: Release

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Display .NET version
      run: dotnet --version

    - name: Restore dependencies
      run: dotnet restore TwinShell.sln

    - name: Build solution
      run: dotnet build TwinShell.sln --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Run tests
      run: dotnet test TwinShell.sln --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/TestResults/**/*'
        retention-days: 7

    - name: Upload code coverage
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: '**/TestResults/**/coverage.cobertura.xml'
        retention-days: 7

    - name: Publish application
      run: dotnet publish src/TwinShell.App/TwinShell.App.csproj --configuration ${{ env.CONFIGURATION }} --output ./publish --self-contained true -r win-x64

    - name: Run smoke tests
      run: |
        # Verify executable exists
        if (!(Test-Path "./publish/TwinShell.App.exe")) {
          Write-Error "Executable not found"; exit 1
        }
        # Verify core DLLs
        $requiredDlls = @("TwinShell.Core.dll", "TwinShell.Infrastructure.dll", "TwinShell.Persistence.dll")
        foreach ($dll in $requiredDlls) {
          if (!(Test-Path "./publish/$dll")) {
            Write-Error "Required DLL not found: $dll"; exit 1
          }
        }
        Write-Host "Smoke tests passed: All required files present"

    - name: Create portable ZIP package
      run: Compress-Archive -Path ./publish/* -DestinationPath ./TwinShell-Portable-win-x64.zip

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TwinShell-Build-${{ github.sha }}
        path: ./publish/**/*
        retention-days: 7

    - name: Upload portable package
      uses: actions/upload-artifact@v4
      with:
        name: TwinShell-Portable-win-x64
        path: ./TwinShell-Portable-win-x64.zip
        retention-days: 30

  release:
    needs: build-and-test
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download portable package
      uses: actions/download-artifact@v4
      with:
        name: TwinShell-Portable-win-x64

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: TwinShell-Portable-win-x64.zip
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
